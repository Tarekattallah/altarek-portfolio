<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#8b5cf6" />
        </linearGradient>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0a0f18" />
            <stop offset="100%" stop-color="#111827" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Background -->
    <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="#1f2937" stroke-width="2"/>
    
    <!-- Hexagon Outer -->
    <polygon points="50,18 78,34 78,66 50,82 22,66 22,34" fill="none" stroke="url(#grad)" stroke-width="4" stroke-linejoin="round" filter="url(#glow)"/>
    
    <!-- Central T -->
    <path d="M 36,40 L 64,40 A 2,2 0 0 1 66,42 L 66,44 A 2,2 0 0 1 64,46 L 54,46 L 54,68 A 2,2 0 0 1 52,70 L 48,70 A 2,2 0 0 1 46,68 L 46,46 L 36,46 A 2,2 0 0 1 34,44 L 34,42 A 2,2 0 0 1 36,40 Z" fill="#ffffff" filter="url(#glow)"/>
    
    <!-- Accents -->
    <circle cx="50" cy="18" r="3" fill="#3b82f6" />
    <circle cx="78" cy="66" r="3" fill="#8b5cf6" />
    <circle cx="22" cy="66" r="3" fill="#3b82f6" />
</svg>
