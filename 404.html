<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Al-Tarek Attallah</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/src/assets/images/logo-pro.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/assets/css/global.css">
    <link rel="stylesheet" href="/src/assets/css/tailwind.css">
</head>
<body class="overflow-x-hidden bg-[#0a0f18]">
    <canvas id="particle-canvas"></canvas>

    <main class="min-h-screen container mx-auto px-6 flex flex-col items-center justify-center text-center">
        <a href="/" class="mb-10 flex items-center gap-2 text-2xl font-bold text-white">
            <img src="/src/assets/images/logo-pro.svg" alt="T. Attallah Logo" class="w-10 h-10 rounded-full object-cover border-2 border-blue-600">
            <span>T. Attallah</span>
        </a>
        <p class="font-mono text-blue-500 text-lg mb-2">HTTP 404</p>
        <h1 class="text-6xl md:text-8xl font-extrabold text-white mb-4">Page not found</h1>
        <p class="text-gray-400 max-w-xl mb-10">The page you're looking for doesn't exist or has moved. Here are a few places to continue:</p>
        <div class="flex flex-wrap justify-center gap-4">
            <a href="/" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-6 rounded-lg transition duration-300">Back to Home</a>
            <a href="/projects/" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-300">View Projects</a>
            <a href="/blog/" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-300">Read the Blog</a>
        </div>
    </main>

    <script type="module">
        import { initParticles } from '/src/shared/ui/particles.js';
        document.addEventListener('DOMContentLoaded', initParticles);
    </script>
</body>
</html>
